# Client implementation portal - MkDocs Material.
# The dashboard renders from status.yml via overrides/hooks/dashboard.py.
# This file and everything under docs/ is independent from the Odoo repository.

site_name: Growth Factors Implementation Portal
site_description: Implementation delivery portal by Growth Factors
site_author: Growth Factors
# site_url is set at publish time from docs.config.yml
copyright: Copyright &copy; Growth Factors. All rights reserved.

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to system preference }
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

nav:
  - Home: index.md
  - Project Overview: overview.md
  - Delivered Modules:
      - Overview: modules/index.md
      - CRM: modules/crm.md
      - Sales & Quoting: modules/sales.md
      - Procurement Automation: modules/procurement.md
      - Accounting & Finance: modules/finance.md
      - Tax & Localization: modules/localization.md
      - Organization & Access: modules/organization.md
  - Business Processes: workflows.md
  - Solution Architecture: architecture.md
  - User Training: training.md
  - Change Requests: changerequests.md
  - Support: support.md

# Auto-generated technical pages are kept for the generator but excluded from
# the client-facing navigation and search (they carry internal module detail).
not_in_nav: |
  modules.md
  decisions.md
  changelog.md

hooks:
  - overrides/hooks/dashboard.py

plugins:
  - search
  - mermaid2
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

extra:
  generator: false
  # Feedback widget target - the dedicated docs repo (issues enabled).
  feedback_provider: github_issues
  repo_owner: IslamIbrahimAIM
  repo_name: accienta-docs
  social:
    - icon: material/web
      link: https://growthfactors.ae
