# =============================================================================
# Growth Factors - Implementation Delivery Status (single source of truth)
# =============================================================================
# The portal dashboard renders from THIS file. Fill every field marked TBD.
# Rules:
#   - Derivable fields (module identity, versions, deployed flag) are prefilled
#     from the live codebase. Do not invent numbers anywhere.
#   - Any field left as TBD renders on the portal as "Pending PM input",
#     never as a fake value.
#   - This file lives OUTSIDE the auto-generated blocks, so an Odoo push will
#     not overwrite it.
# =============================================================================

project:
