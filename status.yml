# =============================================================================
# Growth Factors - Implementation Delivery Status (single source of truth)
# =============================================================================
# The portal dashboard renders from THIS file.
# Values below are drawn from real project state: all 13 crm-prod modules are
# deployed to production (git main) and were lab-validated, and the delivered
# feature lists are the shipped behaviour. No crm-prod pending items are known.
#
# CONFIRM these judgement fields, then adjust if needed:
#   project.overall_completion, project.current_phase, project.health,
#   each module's delivered-vs-under_review status, and client_actions.
# =============================================================================

project:
  client: "Accienta"
  vendor: "Growth Factors"
  overall_completion: 90        # CONFIRM: all capabilities deployed and validated; training and go-live ahead
  current_phase: testing        # CONFIRM: testing | training
  health: on_track              # CONFIRM: on_track | at_risk | blocked
  headline: "Your Odoo Enterprise platform: all core capabilities are live in production and validated, with training and go-live ahead."

# status: completed | in_progress | upcoming
phases:
  - id: discovery
    title: "Discovery"
    status: completed
    detail: "Business processes, channel economics and the two-country (UAE and KSA) scope were mapped."
  - id: design
    title: "Solution Design"
    status: completed
    detail: "Solution and module architecture agreed: layered capabilities extending standard Odoo Enterprise, never modifying core."
  - id: configuration
    title: "Configuration"
    status: completed
    detail: "All core capabilities were built, tested, and deployed to the production environment."
  - id: testing
    title: "Testing / UAT"
    status: in_progress
    detail: "All capabilities are live in production and being validated in day-to-day use ahead of formal sign-off."
  - id: training
    title: "Training"
    status: upcoming
    detail: "Role-based training sessions follow once the finance and localization items close."
  - id: golive
    title: "Go-Live"
    status: upcoming
    detail: "Full go-live once remaining finance and tax items are signed off."

# status: not_started | in_progress | under_review | pending_client_approval | delivered | blocked
