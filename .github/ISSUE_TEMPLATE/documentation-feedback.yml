name: Documentation Feedback
description: Suggest an improvement to the documentation portal
title: "Documentation Feedback - "
labels: [documentation, client-feedback]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: e.g. User Guides
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section
      placeholder: Which part of the page?
  - type: textarea
    id: comment
    attributes:
      label: Client Comment
      placeholder: What is unclear, missing, or wrong?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested Change
      placeholder: What would you like to see instead?
