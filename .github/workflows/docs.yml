# Build and deploy the documentation portal to GitHub Pages.
# This workflow lives in the DEDICATED docs repository — it has no connection
# to the Odoo repository or to Odoo.sh. A failure here never affects Odoo.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "status.yml"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-revision-date plugin needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions mkdocs-minify-plugin

      - name: Secret scan (fail before publishing anything sensitive)
        run: |
          if grep -RInE \
            '(-----BEGIN [A-Z ]*PRIVATE KEY-----|postgres://|postgresql://|client_secret|AWS_SECRET|xox[baprs]-|ghp_[A-Za-z0-9]{20,}|"private_key"|password\s*[:=])' \
            docs mkdocs.yml; then
            echo "::error::Potential secret detected in documentation. Publish blocked."
            exit 1
          fi
          if find docs -name ".env" -o -name "*.pem" -o -name "*.key" | grep -q .; then
            echo "::error::Secret file present under docs/. Publish blocked."
            exit 1
          fi

      - name: Build (strict)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
